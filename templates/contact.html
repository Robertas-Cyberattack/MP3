{% extends "base.html" %}
{% block content %}

<div class="hero center-align">
  <h1>Contact Us</h1>
  <p>Let’s discuss your project requirements.</p>
</div>

<div class="section">
  <div class="row">

    <!-- Contact Info -->
    <div class="col s12 m5">
      <h5>Office Address</h5>
      <p>
        Precision Drafting & Engineering<br>
        Compton Close<br>
        Taunton<br>
        Somerset, UK
      </p>

      <p>
        <strong>Phone:</strong> +44 7746272146<br>
        <strong>Email:</strong> robertas.sladkevicius@gmail.com
      </p>

      <div id="map" style="height:300px;"></div>
    </div>

    <!-- Contact Form -->
    <div class="col s12 m7">
      <form action="{{ url_for('contact_send') }}" method="POST">

        <div class="input-field">
          <input type="text" name="name" required>
          <label>Name</label>
        </div>

        <div class="input-field">
          <input type="email" name="email" required>
          <label>Email</label>
        </div>

        <div class="input-field">
          <input type="text" name="mobile">
          <label>Mobile</label>
        </div>

        <div class="input-field">
          <textarea class="materialize-textarea" name="message" required></textarea>
          <label>Message</label>
        </div>

        <button class="btn blue darken-2" type="submit">
          Send Message
        </button>

      </form>

    </div>

  </div>
</div>

<script async defer
  src="https://maps.googleapis.com/maps/api/js?key={{ google_maps_key }}&callback=initMap"></script>

<script>
  function initMap() {
    var location = { lat: 51.024261, lng: -3.098756 };
    var map = new google.maps.Map(document.getElementById("map"), {
      zoom: 12,
      center: location
    });
    new google.maps.Marker({ position: location, map: map });
  }
</script>

{% endblock %}
