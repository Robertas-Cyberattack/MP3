{% extends "base.html" %}
{% block content %}

<div class="hero center-align">
  <h1>Contact Us</h1>
  <p>Let’s discuss your project requirements.</p>
</div>

<div class="section">
  <div class="row">

    <!-- Contact Info -->
    <div class="col s12 m5">
      <h5>Office Address</h5>
      <p>
        Precision Drafting & Engineering<br>
        123 Engineering Street<br>
        London, UK
      </p>

      <p>
        <strong>Phone:</strong> +44 123 456 7890<br>
        <strong>Email:</strong> info@precisiondrafting.com
      </p>

      <div id="map" style="height:300px;"></div>
    </div>

    <!-- Contact Form -->
    <div class="col s12 m7">
      <form>
        <div class="input-field">
          <input type="text" required>
          <label>Name</label>
        </div>

        <div class="input-field">
          <input type="email" required>
          <label>Email</label>
        </div>

        <div class="input-field">
          <input type="text">
          <label>Mobile</label>
        </div>

        <div class="input-field">
          <textarea class="materialize-textarea" required></textarea>
          <label>Message</label>
        </div>

        <button class="btn blue darken-2">Send Message</button>
      </form>
    </div>

  </div>
</div>

<script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDdEH-U_Pxn9M_Q5Lvr2Sxe0LXpwAK8468&callback=initMap"></script>


<script>
function initMap() {
  var location = {lat: 51.024261, lng: -3.098756};
  var map = new google.maps.Map(document.getElementById("map"), {
    zoom: 12,
    center: location
  });
  new google.maps.Marker({ position: location, map: map });
}
window.onload = initMap;
</script>

{% endblock %}
