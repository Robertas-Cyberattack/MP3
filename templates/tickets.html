<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CAD Tickets</title>
</head>
<body>

    {% for ticket in tickets %}
        {{ ticket.first }}<br>
        {{ ticket.last }}<br>
        {{ ticket.company }}<br>
        {{ ticket.status }}<br>
        {{ ticket.date }}<br>
        {{ ticket.file }}<br>
        {{ ticket.progress }}<br>
        {{ ticket.comments }}<br>
        {{ ticket.clientno }}<br>
    {% endfor %}

</body>
</html>
