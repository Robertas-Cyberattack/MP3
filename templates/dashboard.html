{% extends "base.html" %}
{% block content %}

<h4>My Orders</h4>

<!-- UPLOAD FORM -->
<div class="card">
  <div class="card-content">
    <form method="POST" action="{{ url_for('upload_order') }}" enctype="multipart/form-data">
      <div class="file-field input-field">
        <div class="btn blue">
          <span>Upload File</span>
          <input type="file" name="file" required>
        </div>
        <div class="file-path-wrapper">
          <input class="file-path validate" type="text">
        </div>
      </div>
      <button class="btn blue darken-2">Submit Order</button>
    </form>
  </div>
</div>

<!-- ORDERS LIST -->
{% for order in orders %}
<div class="card">
  <div class="card-content">
    <p><strong>Status:</strong> {{ order.status }}</p>
    <p><strong>Progress:</strong> {{ order.progress }}%</p>

    <div class="progress">
      <div class="determinate" style="width: {{ order.progress }}%"></div>
    </div>

    {% for file in order.files %}
      <p>📄 {{ file }}</p>
    {% endfor %}
  </div>
</div>
{% else %}
<p>No orders yet.</p>
{% endfor %}

{% endblock %}
