{% extends "base.html" %}
{% block content %}

<h4>My Orders</h4>

<div class="card">
  <div class="card-content">
    <form method="POST" action="{{ url_for('upload_order') }}" enctype="multipart/form-data">
      <div class="file-field input-field">
        <div class="btn blue">
          <span>Upload Files</span>
          <input type="file" name="file" multiple required>
        </div>
        <div class="file-path-wrapper">
          <input class="file-path validate" type="text">
        </div>
      </div>
      <button class="btn blue darken-2">Submit Order</button>
    </form>
  </div>
</div>

{% for order in orders %}
<div class="card">
  <div class="card-content">
    <p><strong>Status:</strong> {{ order.status }}</p>
    <p><strong>Progress:</strong> {{ order.progress }}%</p>

    <div class="progress">
      <div class="determinate" style="width: {{ order.progress }}%"></div>
    </div>

    <hr>
    <p><strong>Files:</strong></p>
    {% for f in order.file %}
      <p>📄 {{ f }}</p>
    {% endfor %}

    <form method="POST"
          action="{{ url_for('delete_order', order_id=order._id) }}"
          onsubmit="return confirm('Delete this order permanently?');">
      <button class="btn red darken-2">
        <i class="material-icons left">delete</i>
        Delete Order
      </button>
    </form>
  </div>
</div>
{% else %}
<p>No orders yet.</p>
{% endfor %}

{% endblock %}
