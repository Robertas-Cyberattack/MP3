{% extends "base.html" %}
{% block content %}

<div class="hero">
  <h1>Our Projects</h1>
  <p>Take a look at some of our professional CAD, structural, and civil drafting projects.</p>
</div>

<div class="section">
  <div class="row">
    {% for project in projects %}
    <div class="col s12 m6 l4">
      <div class="card hoverable">
        <div class="card-image">
          <img src="{{ url_for('static', filename='images/' ~ project.image) }}" alt="{{ project.title }}">
        </div>
        <div class="card-content">
          <span class="card-title">{{ project.title }}</span>
          <p>{{ project.description }}</p>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>

  <div style="text-align: center; margin-top: 40px;">
    <a href="{{ url_for('home') }}" class="btn blue darken-2">Back to Home</a>
  </div>
</div>

{% endblock %}
