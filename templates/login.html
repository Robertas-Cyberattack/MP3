{% extends "base.html" %}
{% block content %}

<div class="row">
    <form class="col s12 m6 offset-m3" method="POST" action="{{ url_for('login') }}">
        <div class="card-panel teal">

            <h5 class="center white-text">Login</h5>

            <!-- USERNAME -->
            <div class="input-field">
                <i class="material-icons prefix light-blue-text text-darken-4">person</i>
                <input id="username" name="username" type="text" class="validate" required>
                <label for="username">Username</label>
            </div>

            <!-- PASSWORD -->
            <div class="input-field">
                <i class="material-icons prefix light-blue-text text-darken-4">lock</i>
                <input id="password" name="password" type="password" class="validate" required>
                <label for="password">Password</label>
            </div>

            <!-- SUBMIT -->
            <div class="row">
                <button type="submit" class="col s12 btn-large light-blue darken-4">
                    Login <i class="fas fa-sign-in-alt"></i>
                </button>
            </div>

        </div>
    </form>
</div>

{% endblock %}
