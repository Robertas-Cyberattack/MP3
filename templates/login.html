{% extends "base.html" %}
{% block content %}

<!-- LOGIN PAGE HERO -->
<div class="hero center-align">
  <h1>Login</h1>
  <p>Access your account to manage projects and services.</p>
</div>

<!-- LOGIN FORM SECTION -->
<div class="section">
  <div class="row">
    <form class="col s12 m6 offset-m3" method="POST" action="{{ url_for('login') }}">
      <div class="card-panel blue lighten-5">

        <!-- Form title -->
        <h5 class="center blue-text text-darken-4">Login</h5>

        <!-- Username -->
        <div class="input-field">
          <i class="material-icons prefix">person</i>
          <input id="username" name="username" type="text" required>
          <label for="username">Username</label>
        </div>

        <!-- Password -->
        <div class="input-field">
          <i class="material-icons prefix">lock</i>
          <input id="password" name="password" type="password" required>
          <label for="password">Password</label>
        </div>

        <!-- Submit button -->
        <button class="btn blue darken-2 col s12" type="submit">Login</button>

        <!-- Optional links -->
        <div class="center-align" style="margin-top: 20px;">
          <p>Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
        </div>

      </div>
    </form>
  </div>
</div>

{% endblock %}
