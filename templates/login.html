{% extends "base.html" %}
{% block content %}

<div class="row">
    <form class="col s12 m5" method="POST" action="{{ url_for('login') }}">
        <div class="card-panel teal">
            <span class="white-text">I am a very simple card. I am good at containing small bits of information.
                I am convenient because I require little markup to use effectively. I am similar to what is called a
                panel in other frameworks.
                <div class="input-field col s6">
                    <i class="material-icons prefix light-blue-text text-darken-4">lock</i>
                    <input id="username" name="username" type="text" class="validate">
                    <label for="username">Username</label>
                </div>
            </span>
        </div>
        <!-- password -->
        <div class="row">
            <div class="input-field col s12">
                <i class="material-icons prefix light-blue-text text-darken-4">lock</i>
                <input id="username" name="username" type="text" class="validate">
                <label for="password">Password</label>
            </div>
        </div>
        <!-- Login -->
        <div class="row">
<button type="submit" class="col s12 btn-large light-blue darken-4 text shadow">
    Login <i class="fas fa-sign-in-alt"></i>
</button>
        </div>
    </form>
</div>

{% endblock %}
